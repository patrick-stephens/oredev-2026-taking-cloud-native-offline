apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: podinfo
spec:
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: podinfo-chart
  values:
    replicaCount: 1
    image:
      repository: __REGISTRY_IP__:5000/podinfo
      tag: 6.15.0
      pullPolicy: IfNotPresent
    ui:
      message: "Offline baseline from Git"
