kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 16443
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."__REGISTRY_IP__:5000"]
      endpoint = ["http://__REGISTRY_IP__:5000"]
nodes:
  - role: control-plane
    image: kindest/node:v1.32.2
