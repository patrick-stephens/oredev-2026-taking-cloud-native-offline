---
apiVersion: v1
kind: Namespace
metadata:
  name: lifecycle-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd
  namespace: lifecycle-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
    spec:
      containers:
        - name: httpd
          image: 192.168.56.1:5000/library/httpd:2.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: httpd
  namespace: lifecycle-demo
spec:
  type: NodePort
  selector:
    app: httpd
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
