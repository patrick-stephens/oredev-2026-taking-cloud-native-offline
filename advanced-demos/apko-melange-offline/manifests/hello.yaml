apiVersion: apps/v1
kind: Deployment
metadata:
  name: offline-go-server
  namespace: offline-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offline-go-server
  template:
    metadata:
      labels:
        app: offline-go-server
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: localhost:5000/offline/offline-go-server:0.1.0-amd64
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 1
