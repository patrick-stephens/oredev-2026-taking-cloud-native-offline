package:
  name: offline-go-server
  version: "0.1.0"
  epoch: 0
  description: "Static Go HTTP server built from staged APK packages"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - /tmp/work/artifacts/apko-melange-offline/apk-repo/main
      - /tmp/work/artifacts/apko-melange-offline/apk-repo/community
    packages:
      - go
      - busybox-binsh
      - busybox
      - musl

pipeline:
  - name: Build the static Go HTTP server
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local CGO_ENABLED=0 \
        GOOS=linux GOARCH=amd64 \
        go build -trimpath -ldflags="-s -w -buildid=" \
        -o "${{targets.destdir}}/usr/bin/offline-go-server" .
