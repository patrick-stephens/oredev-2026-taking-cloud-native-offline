package:
  name: offline-greeter
  version: "1.0.0"
  epoch: 0
  description: "A small demo package assembled without network access"
  dependencies:
    runtime:
      - busybox-binsh

environment:
  contents:
    repositories:
      - "@alpine /tmp/work/artifacts/offline-greeter/apk-repo/alpine"
    packages:
      - busybox-binsh@alpine
      - busybox@alpine
      - musl@alpine

pipeline:
  - name: Install the offline greeting
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/offline-greeter" <<'EOF'
      #!/bin/sh
      printf '%s\n' 'hello from an APK built and assembled with no network'
      EOF
      chmod 0755 "${{targets.destdir}}/usr/bin/offline-greeter"
