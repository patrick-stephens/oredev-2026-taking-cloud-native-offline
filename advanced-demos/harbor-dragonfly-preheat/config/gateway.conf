log_format distribution '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 8080;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    access_log /dev/stdout distribution;
    location ~ /blobs/sha256: {
        # Replaced with "return 403" after the direct baseline and preheat.
        proxy_pass http://proxy:8080;
        proxy_set_header Host harbor:8080;
    }
    location / {
        proxy_pass http://proxy:8080;
        proxy_set_header Host harbor:8080;
    }
}
