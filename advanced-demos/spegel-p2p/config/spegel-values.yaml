image:
  repository: ghcr.io/spegel-org/spegel
  tag: v0.8.0
  pullPolicy: IfNotPresent

spegel:
  logLevel: DEBUG
  containerdSock: /run/k3s/containerd/containerd.sock
  containerdContentPath: /var/lib/rancher/k3s/agent/containerd/io.containerd.content.v1.content
  containerdRegistryConfigPath: /var/lib/rancher/k3s/agent/etc/containerd/certs.d
  containerdNamespace: k8s.io
  containerdMirrorAdd: true
  prependExisting: true
  mirroredRegistries:
    - http://registry:5000
  resolveTags: true

service:
  registry:
    nodePort: 30020
  router:
    port: 5001

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi
