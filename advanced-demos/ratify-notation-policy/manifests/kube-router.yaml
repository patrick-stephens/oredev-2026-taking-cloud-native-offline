apiVersion: v1
kind: ServiceAccount
metadata:
  name: offline-network-policy
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: offline-network-policy
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services, nodes, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: offline-network-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: offline-network-policy
subjects:
  - kind: ServiceAccount
    name: offline-network-policy
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: offline-network-policy
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: offline-network-policy
  template:
    metadata:
      labels:
        app: offline-network-policy
    spec:
      hostNetwork: true
      serviceAccountName: offline-network-policy
      tolerations:
        - operator: Exists
      containers:
        - name: kube-router
          image: docker.io/cloudnativelabs/kube-router:v2.5.0
          imagePullPolicy: IfNotPresent
          args:
            - --run-router=false
            - --run-service-proxy=false
            - --run-firewall=true
            - --iptables-sync-period=5s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: xtables
              mountPath: /run/xtables.lock
          readinessProbe:
            httpGet:
              path: /healthz
              port: 20244
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: modules
          hostPath:
            path: /lib/modules
        - name: xtables
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
