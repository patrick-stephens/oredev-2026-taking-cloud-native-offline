apiVersion: v1
kind: Pod
metadata:
  name: unseeded
  namespace: offline-demo
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: unseeded
      image: docker.io/library/busybox:1.37.0
      imagePullPolicy: Always
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
