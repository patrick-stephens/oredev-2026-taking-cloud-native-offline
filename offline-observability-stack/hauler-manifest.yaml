apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: hauler-cluster-images
spec:
  images:
    - name: cr.fluentbit.io/fluent/fluent-bit:4.1.0
    - name: docker.io/grafana/grafana:12.2.0
    - name: quay.io/kiwigrid/k8s-sidecar:1.30.10
    - name: quay.io/prometheus/alertmanager:v0.28.1
    - name: quay.io/prometheus/node-exporter:v1.9.1
    - name: quay.io/prometheus-operator/prometheus-config-reloader:v0.86.0
    - name: quay.io/prometheus-operator/prometheus-operator:v0.86.0
    - name: quay.io/prometheus/prometheus:v3.6.0
    - name: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
    # Added from zarf.yaml
    - name: docker.io/bats/bats:v1.4.1
    - name: quay.io/thanos/thanos:v0.39.2
    - name: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.6.3
    - name: ghcr.io/telemetryforge/agent:25.10.2
    - name: busybox:latest
    # Added to serve images
    - name: docker.io/registry:3.0.0
---
apiVersion: content.hauler.cattle.io/v1
kind: Charts
metadata:
  name: hauler-cluster-charts
spec:
  charts:
    # Specify subchart via name
    - name: fluent-bit
      repoURL: https://fluent.github.io/helm-charts/
      version: 0.54.0
    - name: kube-prometheus-stack
      repoURL: oci://ghcr.io/prometheus-community/charts
      version: 78.2.1
---
apiVersion: content.hauler.cattle.io/v1
kind: Files
metadata:
  name: hauler-content-files
spec:
  files:
    - path: values-ds.yaml
    - path: values-aggregator.yaml
    - path: registry.yaml
    - path: https://github.com/derailed/k9s/releases/download/v0.50.15/k9s_Linux_amd64.tar.gz
    - path: https://github.com/derailed/k9s/releases/download/v0.50.15/k9s_Linux_arm64.tar.gz
