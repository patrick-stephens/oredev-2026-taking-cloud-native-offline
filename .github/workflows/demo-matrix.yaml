name: Demo matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-demos:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        demo:
          - live-1
          - live-2
          - adv-01
          - adv-02
          - adv-03
          - adv-04
          - adv-05
          - adv-06
          - adv-07
          - adv-08
          - adv-09
          - adv-10
          - adv-11
    uses: $/.github/workflows/demo-run.yaml
    with:
      demo: ${{ matrix.demo }}
